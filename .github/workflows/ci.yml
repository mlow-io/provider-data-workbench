name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev,mcp]"
      - run: python scripts/check_project_docs.py
      - run: python scripts/sync_bundled_assets.py
      - run: make validate
      - run: PYTHONPATH=src python scripts/evaluation/independent/run.py --root "$RUNNER_TEMP/pdtl-mapping-replay"
      - run: python scripts/check_distribution.py --root "$RUNNER_TEMP/pdtl-distribution"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npm test --prefix web
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm run test:e2e --prefix web -- --output "$RUNNER_TEMP/pdtl-browser-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distribution-check
          path: |
            ${{ runner.temp }}/pdtl-distribution/*.txt
            ${{ runner.temp }}/pdtl-distribution/*.json
            ${{ runner.temp }}/pdtl-distribution/*-journey/result.json
            ${{ runner.temp }}/pdtl-distribution/dist/*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: ${{ runner.temp }}/pdtl-browser-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-mapping-replay
          path: ${{ runner.temp }}/pdtl-mapping-replay/result.json
